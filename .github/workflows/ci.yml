name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python main.py --version
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v

  ml-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt
      - run: python main.py pipeline --config experiments/smoke.json
      - run: python main.py pipeline-m7 --config experiments/m7-smoke.json
      - run: python main.py pipeline-m8 --config experiments/m8-smoke.json
      - run: python main.py pipeline-m10 --config experiments/m10-smoke.json
      - run: >-
          python -c "from pathlib import Path; from beehive.ml import
          LOCAL_FEATURE_SIZE,_build_sized_model,_torch; t=_torch();
          p=Path('models/m11-smoke-source.pt'); p.parent.mkdir(exist_ok=True);
          t.save({'state_dict':_build_sized_model(t,LOCAL_FEATURE_SIZE).state_dict(),
          'feature_size':LOCAL_FEATURE_SIZE},p)"
      - run: python main.py pipeline-m11 --config experiments/m11-smoke.json
