name: Bug report
description: Report a reproducible SweetGold defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make SweetGold more reliable.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the seed and configuration when relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SweetGold version or commit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
    validations:
      required: true
