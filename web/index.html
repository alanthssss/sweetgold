<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SweetGold · 策略竞技场</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="eyebrow">SWEETGOLD / STRATEGY ARENA</span>
      <h1 data-en="See intelligence compete." data-zh="让智能策略同场较量。">让智能策略同场较量。</h1>
      <p data-en="Same world. Same seed. Different decisions." data-zh="同一个世界，同一个随机种子，不同的决策。">同一个世界，同一个随机种子，不同的决策。</p>
    </div>
    <button id="language" class="ghost" type="button">English</button>
  </header>

  <main>
    <section class="control-deck">
      <label>
        <span data-en="LEFT STRATEGY" data-zh="左侧策略">左侧策略</span>
        <select id="leftStrategy"></select>
      </label>
      <div class="versus">VS</div>
      <label>
        <span data-en="RIGHT STRATEGY" data-zh="右侧策略">右侧策略</span>
        <select id="rightStrategy"></select>
      </label>
      <label class="seed">
        <span data-en="MATCHED SEED" data-zh="匹配种子">匹配种子</span>
        <input id="seed" type="number" value="42">
      </label>
      <button id="reset" data-en="New match" data-zh="新对局">新对局</button>
      <button id="toggle" class="primary" data-en="Run" data-zh="运行">运行</button>
      <button id="step" data-en="Step" data-zh="单步">单步</button>
    </section>

    <section id="notice" class="notice" hidden></section>

    <section class="tournament">
      <div class="section-heading">
        <div>
          <span class="eyebrow" data-en="MATCHED-SEED LEAGUE" data-zh="同种子联赛">同种子联赛</span>
          <h2 data-en="Turn comparisons into a leaderboard." data-zh="把策略比较变成排行榜。">把策略比较变成排行榜。</h2>
        </div>
        <p data-en="Select available strategies. Every entrant faces the same worlds, then receives three points per match win and one per tie."
           data-zh="选择可用策略。所有参赛者面对完全相同的世界；每场获胜得 3 分，平局得 1 分。">选择可用策略。所有参赛者面对完全相同的世界；每场获胜得 3 分，平局得 1 分。</p>
      </div>
      <div class="tournament-controls">
        <div id="tournamentStrategies" class="strategy-checks"></div>
        <label>
          <span data-en="EPISODES" data-zh="对局数">对局数</span>
          <input id="tournamentEpisodes" type="number" min="1" max="50" value="10">
        </label>
        <button id="runTournament" class="primary" type="button" data-en="Run league" data-zh="运行联赛">运行联赛</button>
      </div>
      <div id="tournamentStatus" class="tournament-status"></div>
      <div id="leaderboard" class="leaderboard" hidden></div>
    </section>

    <section class="model-library">
      <div class="section-heading">
        <div>
          <span class="eyebrow" data-en="PROMOTED MODEL REGISTRY" data-zh="已晋级模型注册表">已晋级模型注册表</span>
          <h2 data-en="Know what you are running." data-zh="先了解模型，再运行策略。">先了解模型，再运行策略。</h2>
        </div>
        <p data-en="Only models that passed their declared promotion gates appear here. Later robustness failures remain visible."
           data-zh="这里只展示通过既定晋级门槛的模型，后续鲁棒性失败也不会被隐藏。">这里只展示通过既定晋级门槛的模型，后续鲁棒性失败也不会被隐藏。</p>
      </div>
      <div id="modelCards" class="model-cards"></div>
    </section>

    <section class="scoreboard">
      <div>
        <span id="leftName">—</span>
        <strong id="leftHoney">0</strong>
        <small data-en="HONEY" data-zh="蜂蜜">蜂蜜</small>
      </div>
      <div class="delta">
        <span data-en="LIVE DELTA" data-zh="实时差值">实时差值</span>
        <strong id="honeyDelta">0</strong>
        <small id="leader" data-en="Even" data-zh="持平">持平</small>
      </div>
      <div>
        <span id="rightName">—</span>
        <strong id="rightHoney">0</strong>
        <small data-en="HONEY" data-zh="蜂蜜">蜂蜜</small>
      </div>
    </section>

    <section class="arenas">
      <article class="lane lane-left">
        <div class="lane-heading">
          <div><span class="lane-tag">A</span><b id="leftTitle">—</b></div>
          <span id="leftWeather">☀</span>
        </div>
        <div id="leftWorld" class="world" aria-label="Left strategy ecosystem"></div>
        <div id="leftMetrics" class="metrics"></div>
      </article>
      <article class="lane lane-right">
        <div class="lane-heading">
          <div><span class="lane-tag">B</span><b id="rightTitle">—</b></div>
          <span id="rightWeather">☀</span>
        </div>
        <div id="rightWorld" class="world" aria-label="Right strategy ecosystem"></div>
        <div id="rightMetrics" class="metrics"></div>
      </article>
    </section>

    <section class="replay">
      <div class="replay-head">
        <div>
          <span class="eyebrow" data-en="MATCH REPLAY" data-zh="对局回放">对局回放</span>
          <strong><span data-en="Tick" data-zh="步数">步数</span> <b id="tick">0</b> / <b id="maxTick">240</b></strong>
        </div>
        <span id="replayState" data-en="Live" data-zh="实时">实时</span>
      </div>
      <input id="timeline" type="range" min="0" max="0" value="0">
      <div class="legend">
        <span>🍯 <b data-en="Hive" data-zh="蜂巢">蜂巢</b></span>
        <span>🌼 <b data-en="Flower" data-zh="花朵">花朵</b></span>
        <span>🐝 <b data-en="Bee" data-zh="蜜蜂">蜜蜂</b></span>
        <span class="target-key"><i></i><b data-en="Assigned target" data-zh="分配目标">分配目标</b></span>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
